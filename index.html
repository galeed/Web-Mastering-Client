<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mastering Pro App 🐱</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f4f6f9;
            --surface: #ffffff;
            --surface-card: #f8fafc;
            --border-subtle: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-primary: #0284c7; /* Azul tipo DAW/Portal */
            --accent-hover: #0369a1;
            --accent-pink: #ec4899;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .portal-wrapper {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
        }

        .portal-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-pink));
        }

        .portal-header {
            padding: 22px 28px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            font-size: 2.2rem;
            background: var(--surface-card);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            line-height: 1;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin: 0;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 2px 0 0 0;
            font-weight: 600;
        }

        .portal-badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            background: rgba(2, 132, 199, 0.1);
            color: var(--accent-primary);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(2, 132, 199, 0.2);
            text-transform: uppercase;
        }

        .portal-body {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            border-bottom: 2px solid var(--border-subtle);
            padding-bottom: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-box, select {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .input-box:focus, select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        input[type="file"] {
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
        }

        input[type="file"]::file-selector-button {
            background: var(--border-subtle);
            color: var(--text-main);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .btn-master {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-master:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-master:disabled {
            background: var(--border-subtle);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #status-console {
            background: #0f172a;
            color: #38bdf8;
            border-radius: 10px;
            padding: 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            max-height: 140px;
            overflow-y: auto;
            display: none;
            border: 1px solid #1e293b;
        }

        #status-console.active {
            display: block;
        }

        .download-link {
            color: #4ade80 !important;
            text-decoration: none;
            font-weight: bold;
        }
        .download-link:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .portal-body { padding: 18px; }
        }
    </style>
</head>
<body>

    <div class="portal-wrapper">
        <header class="portal-header">
            <div class="brand-container">
                <div class="brand-logo">🐱</div>
                <div>
                    <h1 class="brand-title">Mastering Pro App</h1>
                    <p class="brand-subtitle">Console UI</p>
                </div>
            </div>
            <div class="portal-badge">Custom</div>
        </header>

        <div class="portal-body">
            <!-- Credenciales y Archivo -->
            <div class="control-group">
                <label class="control-label">API Token de Bakuage</label>
                <input type="text" id="api-token" class="input-box" placeholder="Pega tu token aquí...">
            </div>

            <div class="control-group">
                <label class="control-label">Archivo de Audio (WAV / FLAC / MP3)</label>
                <input type="file" id="audio-file" class="input-box" accept=".wav,.flac,.mp3,audio/wav,audio/flac,audio/mpeg">
            </div>

            <!-- Opciones Avanzadas de Mastering -->
            <div class="section-title">Parámetros de Mastering</div>

            <div class="grid-2">
                <div class="control-group">
                    <label class="control-label">Target Loudness (LUFS)</label>
                    <input type="number" id="target-loudness" class="input-box" value="-14" step="0.5">
                </div>
                <div class="control-group">
                    <label class="control-label">Ceiling (dBFS)</label>
                    <input type="number" id="ceiling" class="input-box" value="-1.0" step="0.1">
                </div>
            </div>

            <div class="grid-2">
                <div class="control-group">
                    <label class="control-label">Formato de Salida</label>
                    <select id="output-format" class="input-box">
                        <option value="wav">WAV (Original/Standard)</option>
                        <option value="mp3">MP3 (320kbps)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Algoritmo</label>
                    <select id="algorithm" class="input-box">
                        <option value="v2">V2 (Latest)</option>
                        <option value="v1">V1</option>
                    </select>
                </div>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" id="preserve-bass" checked>
                Preservar Bajos (Preserve Bass)
            </label>

            <button class="btn-master" id="process-btn" onclick="initMastering()">
                🚀 Iniciar Masterizado Pro
            </button>

            <div id="status-console"></div>
        </div>
    </div>

    <script>
        const API_BASE = "https://api.bakuage.com/api/v1";

        function logMessage(msg) {
            const consoleBox = document.getElementById("status-console");
            consoleBox.classList.add("active");
            const time = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `[${time}] ${msg}\n`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function resetConsole() {
            const consoleBox = document.getElementById("status-console");
            consoleBox.innerHTML = '';
            consoleBox.classList.remove('active');
        }

        async function initMastering() {
            const token = document.getElementById("api-token").value.trim();
            const fileInput = document.getElementById("audio-file");
            const btn = document.getElementById("process-btn");

            // Obtener parámetros de la interfaz
            const targetLoudness = parseFloat(document.getElementById("target-loudness").value);
            const ceiling = parseFloat(document.getElementById("ceiling").value);
            const outputFormat = document.getElementById("output-format").value;
            const algorithm = document.getElementById("algorithm").value;
            const preserveBass = document.getElementById("preserve-bass").checked;

            if (!token) {
                alert("⚠️ Ingresa tu API Token para continuar.");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("⚠️ Selecciona una pista de audio.");
                return;
            }

            const file = fileInput.files[0];
            btn.disabled = true;
            resetConsole();
            logMessage("Conectando con el servidor...");

            try {
                // 1. Crear tarea enviando los parámetros de configuración en el cuerpo JSON si la API los soporta
                const createRes = await fetch(`${API_BASE}/masterings`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        target_loudness: targetLoudness,
                        ceiling: ceiling,
                        output_format: outputFormat,
                        algorithm: algorithm,
                        preserve_bass: preserveBass
                    })
                });

                if (!createRes.ok) throw new Error(`Error de autenticación o parámetros (HTTP ${createRes.status})`);
                const createData = await createRes.json();
                const masteringId = createData.id;
                const uploadUrl = createData.upload_url;

                logMessage(`Sesión creada [ID: ${masteringId}]`);

                // 2. Subir archivo binario
                logMessage(`Cargando archivo (${file.name})...`);
                const uploadRes = await fetch(uploadUrl, {
                    method: 'PUT',
                    body: file
                });

                if (!uploadRes.ok) throw new Error("Falló la subida del archivo al almacenamiento.");
                logMessage("Archivo cargado correctamente.");

                // 3. Activar procesamiento
                logMessage("Enviando orden de procesamiento...");
                const patchRes = await fetch(`${API_BASE}/masterings/${masteringId}`, {
                    method: 'PATCH',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'uploaded' })
                });

                if (!patchRes.ok) throw new Error("No se pudo activar el proceso de masterizado.");

                // 4. Polling de estado
                logMessage("Motor analizando y procesando pista...");
                pollStatus(token, masteringId);

            } catch (error) {
                logMessage(`❌ Error: ${error.message}`);
                btn.disabled = false;
            }
        }

        function pollStatus(token, masteringId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE}/masterings/${masteringId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) throw new Error("Error consultando estado.");
                    const data = await res.json();

                    logMessage(`Estado: ${data.status}`);

                    if (data.status === 'finished') {
                        clearInterval(interval);
                        logMessage("✨ ¡MASTERIZADO COMPLETADO!");
                        if (data.download_url) {
                            logMessage(`📥 <a href="${data.download_url}" target="_blank" class="download-link">Descargar archivo masterizado</a>`);
                        }
                        document.getElementById("process-btn").disabled = false;
                    } else if (data.status === 'failed' || data.status === 'error') {
                        clearInterval(interval);
                        logMessage("❌ El proceso falló en el servidor.");
                        document.getElementById("process-btn").disabled = false;
                    }
                } catch (e) {
                    clearInterval(interval);
                    logMessage(`❌ Error de red: ${e.message}`);
                    document.getElementById("process-btn").disabled = false;
                }
            }, 6000);
        }
    </script>
</body>
</html>
