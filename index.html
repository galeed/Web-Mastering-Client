<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mastering Pro App 🐱</title>
    <!-- Tipografía moderna estilo editorial / portal musical -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b0e;
            --surface: #13151b;
            --surface-card: #181b22;
            --border-subtle: #252a35;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff007f; /* Toque vibrante estilo club / música electrónica */
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Plus Jakarta+Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.05) 0%, transparent 40%);
        }

        .portal-wrapper {
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            position: relative;
        }

        /* Barra superior decorativa estilo portal */
        .portal-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan));
        }

        .portal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-card);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            font-size: 2.2rem;
            background: var(--surface);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            line-height: 1;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            margin: 0;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 2px 0 0 0;
            font-weight: 600;
        }

        .portal-badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-cyan);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            text-transform: uppercase;
        }

        .portal-body {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-label span {
            color: var(--accent-pink);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: none;
        }

        /* Inputs estilizados tipo consola */
        .input-box {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: #fff;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.1);
        }

        input[type="file"] {
            color: var(--text-muted);
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: var(--border-subtle);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 12px;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--accent-pink);
        }

        .btn-master {
            background: linear-gradient(135deg, var(--accent-pink), #ff2a5f);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(255, 0, 127, 0.3);
            transition: all 0.2s ease;
            margin-top: 6px;
        }

        .btn-master:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.5);
        }

        .btn-master:disabled {
            background: var(--border-subtle);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Consola de estado */
        #status-console {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 16px;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: pre-wrap;
            max-height: 160px;
            overflow-y: auto;
            display: none;
        }

        #status-console.active {
            display: block;
        }

        .download-link {
            color: var(--accent-cyan) !important;
            text-decoration: none;
            font-weight: bold;
        }
        .download-link:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .portal-header { padding: 18px 20px; }
            .portal-body { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="portal-wrapper">
        <header class="portal-header">
            <div class="brand-container">
                <div class="brand-logo">🐱</div>
                <div>
                    <h1 class="brand-title">Mastering Pro App</h1>
                    <p class="brand-subtitle">Cloud Mastering Console</p>
                </div>
            </div>
            <div class="portal-badge">v1.0.0</div>
        </header>

        <div class="portal-body">
            <div class="control-group">
                <label class="control-label">
                    1. Credencial de Acceso <span>API Token</span>
                </label>
                <input type="text" id="api-token" class="input-box" placeholder="Pega tu token aquí...">
            </div>

            <div class="control-group">
                <label class="control-label">
                    2. Archivo de Audio <span>WAV / FLAC / MP3</span>
                </label>
                <input type="file" id="audio-file" class="input-box" accept=".wav,.flac,.mp3,audio/wav,audio/flac,audio/mpeg">
            </div>

            <button class="btn-master" id="process-btn" onclick="initMastering()">
                🚀 Iniciar Masterizado
            </button>

            <div id="status-console"></div>
        </div>
    </div>

    <script>
        const API_BASE = "https://api.bakuage.com/api/v1";

        function logMessage(msg) {
            const consoleBox = document.getElementById("status-console");
            consoleBox.classList.add("active");
            const time = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `[${time}] ${msg}\n`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function resetConsole() {
            const consoleBox = document.getElementById("status-console");
            consoleBox.innerHTML = '';
            consoleBox.classList.remove('active');
        }

        async function initMastering() {
            const token = document.getElementById("api-token").value.trim();
            const fileInput = document.getElementById("audio-file");
            const btn = document.getElementById("process-btn");

            if (!token) {
                alert("⚠️ Ingresa tu API Token para continuar.");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("⚠️ Selecciona una pista de audio.");
                return;
            }

            const file = fileInput.files[0];
            btn.disabled = true;
            resetConsole();
            logMessage("Estableciendo enlace con el motor cloud...");

            try {
                // 1. Crear tarea
                const createRes = await fetch(`${API_BASE}/masterings`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!createRes.ok) throw new Error(`Error de autenticación o servidor (HTTP ${createRes.status})`);
                const createData = await createRes.json();
                const masteringId = createData.id;
                const uploadUrl = createData.upload_url;

                logMessage(`Sesión creada [ID: ${masteringId}]`);

                // 2. Subir archivo binario
                logMessage(`Cargando archivo (${file.name})...`);
                const uploadRes = await fetch(uploadUrl, {
                    method: 'PUT',
                    body: file
                });

                if (!uploadRes.ok) throw new Error("Falló la subida del archivo al almacenamiento temporal.");
                logMessage("Carga completada con éxito.");

                // 3. Activar procesamiento
                logMessage("Enviando orden de procesamiento...");
                const patchRes = await fetch(`${API_BASE}/masterings/${masteringId}`, {
                    method: 'PATCH',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'uploaded' })
                });

                if (!patchRes.ok) throw new Error("No se pudo activar el proceso de masterizado.");

                // 4. Polling de estado
                logMessage("Pista en cola de mastering...");
                pollStatus(token, masteringId);

            } catch (error) {
                logMessage(`❌ Error: ${error.message}`);
                btn.disabled = false;
            }
        }

        function pollStatus(token, masteringId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE}/masterings/${masteringId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) throw new Error("Error consultando estado.");
                    const data = await res.json();

                    logMessage(`Estado del motor: ${data.status}`);

                    if (data.status === 'finished') {
                        clearInterval(interval);
                        logMessage("✨ ¡MASTERIZADO FINALIZADO!");
                        if (data.download_url) {
                            logMessage(`📥 <a href="${data.download_url}" target="_blank" class="download-link">Descargar pista masterizada</a>`);
                        }
                        document.getElementById("process-btn").disabled = false;
                    } else if (data.status === 'failed' || data.status === 'error') {
                        clearInterval(interval);
                        logMessage("❌ El motor encontró un fallo procesando el audio.");
                        document.getElementById("process-btn").disabled = false;
                    }
                } catch (e) {
                    clearInterval(interval);
                    logMessage(`❌ Error de red: ${e.message}`);
                    document.getElementById("process-btn").disabled = false;
                }
            }, 6000);
        }
    </script>
</body>
</html>
